<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 运营 Agent 平台 MVP</title>
  <link rel="stylesheet" href="./prototype-assets/ui.css" />
  <style>
    .landing {
      min-height: calc(100vh - 48px);
      display: grid;
      place-items: center;
    }

    .landing-card {
      width: min(1100px, 100%);
      padding: 34px;
      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.82);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .landing-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 24px;
    }

    .landing-card h1 {
      margin: 16px 0 10px;
      font-family: "Baskerville", "Songti SC", serif;
      font-size: clamp(36px, 4vw, 56px);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .landing-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }

    .entry {
      display: block;
      padding: 22px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(29, 34, 48, 0.08);
      transition: 160ms ease;
    }

    .entry:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-soft);
    }

    .entry strong {
      display: block;
      font-size: 18px;
      margin-bottom: 8px;
    }

    .entry span {
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .landing-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell landing">
    <section class="landing-card">
      <div class="hero-eyebrow">AI Ops Agent MVP</div>
      <h1>AI 运营 Agent 平台</h1>
      <p>
        这是一个在短时间内完成的最小可用版本，用于验证 Manager + Worker 的平台架构是否能跑通通用运营问题处理闭环。
        当前版本不接真实后台，而是先用通用输入、通用 Worker 和结构化结果输出来证明平台方向可落地。
      </p>
      <div class="landing-grid">
        <a class="entry" href="./platform.html">
          <strong>进入平台 Demo</strong>
          <span>体验输入事件、Manager 路由、Worker 执行、结果汇总与人工确认建议的完整闭环。</span>
        </a>
        <a class="entry" href="./README.html">
          <strong>查看项目说明</strong>
          <span>了解当前 MVP 的目标、范围、页面结构、节点职责和后续扩展方向。</span>
        </a>
      </div>
    </section>
  </div>
</body>
</html>
